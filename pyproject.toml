[project]
name = "chicago-loop"
version = "0.1.0"
description = "A 1:1 model of the Chicago Loop and the elevated L from real map data"
requires-python = ">=3.11,<3.12"
dependencies = ["bpy==5.0.1", "pyproj>=3.7", "shapely>=2.0", "certifi"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["blender/prototype_city.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]
